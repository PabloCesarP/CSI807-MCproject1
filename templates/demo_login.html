<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha UFOP - Protótipo / Demonstração</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 50px; }
        .demo-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .alert { background: #ffeeba; padding: 10px; border-left: 5px solid #ffc107; margin-bottom: 20px; }
        select, button { width: 100%; padding: 10px; margin-top: 10px; }
        button { background-color: #800000; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #600000; }
    </style>
</head>
<body>
    <div class="demo-container">
        <h2>Entrar na Demonstração</h2>
        <div class="alert">
            <strong>Aviso:</strong> Este é um ambiente de simulação. Nenhuma credencial real (CPF/Senha) da UFOP é solicitada ou armazenada.
        </div>
        <form method="POST">
            <label>Escolha o Aluno Fictício:</label>
            <select name="aluno">
                {% for aluno in alunos %}
                    <option value="{{ aluno.id }}">{{ aluno.nome }} - {{ aluno.curso }}</option>
                {% endfor %}
            </select>

            <label>Carregar Cenário Pronto:</label>
            <select name="cenario">
                {% for cenario in cenarios %}
                    <option value="{{ cenario.id }}">{{ cenario.nome }}</option>
                {% endfor %}
            </select>

            <button type="submit">Aplicar Cenário e Entrar</button>
        </form>
    </div>
</body>
</html>
